<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متابعة اليوم الدراسي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a4f5b">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --ink:#16313a; --teal:#0f6b7a; --teal-d:#0a4f5b; --teal-l:#e2f0f2; --red:#c4303f; --gold:#e2a82e;
  --paper:#f4f7f7; --line:#cfdadc; --grey:#c9c9c9; --ok:#1f7a4d;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Segoe UI",Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* top bar */
.top{background:var(--teal-d);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:5}
.top img{width:40px;height:34px;object-fit:contain;background:#fff;border-radius:50%}
.top .who{flex:1;line-height:1.25}
.top .who small{display:block;opacity:.8;font-size:13px}
.top button{background:transparent;border:1px solid #ffffff80;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
.tabs{display:flex;gap:4px;padding:8px 12px 0;background:var(--teal-d);overflow-x:auto}
.tabs button{border:0;background:transparent;color:#cfe6ea;padding:10px 16px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap;font-weight:600}
.tabs button.on{background:var(--paper);color:var(--teal-d)}
main{max-width:980px;margin:0 auto;padding:16px}

/* login */
.login{max-width:380px;margin:8vh auto;padding:24px;background:#fff;border:1px solid var(--line);border-radius:14px;text-align:center}
.login img{width:120px;margin-bottom:6px}
.login h1{font-size:20px;margin:4px 0 18px}
.login label{display:block;text-align:right;margin:10px 0 4px;font-weight:600}

/* generic */
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:17px;margin:0 0 12px}
label.l{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:92px;resize:vertical}
.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--teal-d)}
.btn.sec{background:#fff;color:var(--teal-d);border:1px solid var(--teal)}
.btn.red{background:var(--red)}
.btn.sm{padding:6px 12px;font-size:14px;font-weight:600}
.btn:disabled{opacity:.55;cursor:wait}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.muted{color:#5d747b;font-size:14px}
.empty{padding:18px;text-align:center;color:#5d747b;border:1.5px dashed var(--line);border-radius:10px}

/* date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--teal-l);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.datebar .dn{font-size:24px;font-weight:800;color:var(--teal-d)}
.datebar .dn small{font-size:16px;font-weight:600;margin-inline-start:8px}
.datebar .dd{font-size:20px;font-weight:700;direction:ltr}
.datebar input{width:auto}

/* entries list */
.ent{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.ent:last-child{border:0}
.ent .n{background:var(--teal);color:#fff;border-radius:8px;min-width:34px;text-align:center;font-weight:800;padding:2px 6px}
.ent .sub{font-weight:700}
.ent .meta{font-size:14px;color:#5d747b}
.ent .acts{display:flex;gap:6px}

/* the sheet (looks like the paper form) */
.sheetwrap{overflow-x:auto;padding-bottom:6px;direction:ltr}
.sheet{direction:ltr;min-width:640px;background:#fff;color:#000;border:3px double #000;padding:14px 16px 18px;font-family:"Times New Roman",Times,serif}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-head .t{font-size:15px;line-height:1.4}
.sh-head .dayline{margin-top:10px;display:flex;gap:46px;font-family:Arial,sans-serif;font-size:15px}
.sh-head .dayline b{font-size:19px}
.sh-head .dayline i{font-size:21px;font-weight:700}
.sh-logo{width:78px;height:auto}
.sheet h3{text-align:center;font-weight:400;font-size:19px;margin:6px 0 2px}
.sheet .sub2{text-align:center;font-size:13px;color:#555;margin-bottom:8px;font-family:Arial,Tahoma,sans-serif}
.sheet table{width:100%;border-collapse:collapse;border:3px solid #000;table-layout:fixed}
.sheet th{background:var(--grey);border:1.5px solid #000;font-size:16px;padding:12px 4px;border-bottom:4px solid #000}
.sheet td{border:1.5px solid #000;text-align:center;font:700 14px Arial,Tahoma,sans-serif;padding:6px;height:54px;word-break:break-word;unicode-bidi:plaintext;white-space:pre-line}
.sheet td.s{background:var(--grey)}
.sheet col.c1{width:11%}.sheet col.c2{width:20%}.sheet col.c3{width:34%}.sheet col.c4{width:22%}.sheet col.c5{width:13%}

/* tables for settings */
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:6px 4px;text-align:right;vertical-align:middle}
.tbl input,.tbl select{padding:7px 8px}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#toast.err{background:var(--red)}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px;flex-wrap:wrap}
.fhead b{font-size:16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.bar>div{flex:1;min-width:130px}
@media (max-width:520px){main{padding:10px}.card{padding:12px}.datebar .dn{font-size:20px}}
@media print{.top,.tabs,.bar,.btn{display:none}}

.login .btn.big{display:block;width:100%;margin:10px 0;padding:16px;font-size:18px}.login .btn.sec:not(.big){margin-top:6px}.login .chips{justify-content:center}

#gal{position:fixed;inset:0;background:var(--paper);z-index:30;overflow:auto}
.galtop{position:sticky;top:0;background:var(--teal-d);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:8px;flex-wrap:wrap}
.galbtns{display:flex;gap:8px;flex-wrap:wrap}
.galbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding:14px}
.galitem{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.galitem img{width:100%;border:1px solid var(--line);display:block}
.galname{font-size:12px;color:#5d747b;word-break:break-all;margin:6px 0;direction:ltr}
.galitem a.btn{display:inline-block;text-decoration:none}

</style>
</head>

      for (let s = from; s <= to; s++) {

(() => {

  for (const [k, v] of AR_ORD) if (String(g).includes(k)) return v;
  return 99;

  const so = (s) => S.config.stages.indexOf(s), ix = (c) => S.config.classes.findIndex((x) => x.id === c.id);
  return [...list].sort((a, b) => so(a.stage) - so(b.stage) || TRACK_ORDER.indexOf(a.track) - TRACK_ORDER.indexOf(b.track)

const logoImg = new Image(); const logoReady = new Promise((r) => { logoImg.onload = r; logoImg.onerror = r; }); logoImg.src = LOGO;
const hasAr = (t) => /[\u0600-\u06FF]/.test(t);
function wrap(ctx, text, maxW) {
  const out = [];
  String(text).split('\n').forEach((par) => {
    let cur = '';
    par.split(/\s+/).filter(Boolean).forEach((w) => {
      const t = cur ? cur + ' ' + w : w;
      if (!cur || ctx.measureText(t).width <= maxW) cur = t; else { out.push(cur); cur = w; }
    });
    if (cur) out.push(cur);
  });
  return out;
}
function cellText(ctx, items, x, y, w, h, maxF) {
  if (!items.length) return;
  const fam = 'Arial, Tahoma, sans-serif'; let size = maxF, lines;
  for (; size >= 8; size--) {
    ctx.font = `bold ${size}px ${fam}`;
    lines = items.flatMap((it, i) => wrap(ctx, it, w - 14).map((l, j) => ({ l, gap: i > 0 && j === 0 ? size * 0.35 : 0 })));
    const tot = lines.reduce((a, b) => a + size * 1.3 + b.gap, 0);
    if (tot <= h - 8) break;
  }
  const tot = lines.reduce((a, b) => a + size * 1.3 + b.gap, 0);
  let cy = y + (h - tot) / 2;
  ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((o) => { cy += o.gap; ctx.direction = hasAr(o.l) ? 'rtl' : 'ltr'; ctx.fillText(o.l, x + w / 2, cy + size * 0.65); cy += size * 1.3; });
  ctx.direction = 'ltr';
}
async function drawForm(c) {
  await logoReady;
  const cfg = S.config, d = S.date, K = 2, rows = formModel(c.id);
  const cv = document.createElement('canvas'); cv.width = 794 * K; cv.height = 1123 * K;
  const x = cv.getContext('2d'); x.scale(K, K);
  x.fillStyle = '#fff'; x.fillRect(0, 0, 794, 1123);
  // ornamental border
  x.strokeStyle = '#000'; x.lineWidth = 2; x.strokeRect(34, 34, 726, 1056); x.strokeRect(50, 50, 694, 1024);
  x.lineWidth = 1.2;
  const ring = (cx, cy) => { x.beginPath(); x.arc(cx, cy, 4.2, 0, 7); x.stroke(); };
  for (let i = 42 + 8; i < 752; i += 13) { ring(i, 42); ring(i, 1082); }
  for (let j = 42 + 8; j < 1082; j += 13) { ring(42, j); ring(752, j); }
  x.textBaseline = 'alphabetic'; x.textAlign = 'left'; x.direction = 'ltr'; x.fillStyle = '#000';
  x.font = '17px "Times New Roman", serif'; x.fillText(cfg.headerLine1, 76, 72); x.fillText(cfg.headerLine2, 76, 94);
  x.font = 'bold 18px Arial'; x.fillText('Day:', 143, 122);
  x.font = 'italic bold 24px Arial'; x.fillText(DAYS_EN[dow(d)], 190, 123);
  x.font = 'bold 18px Arial'; x.fillText('Date:', 408, 122);
  x.font = 'bold 22px "Times New Roman", serif'; x.fillText(fmtDate(d), 470, 123);
  x.drawImage(logoImg, 615, 54, 116, 100);
  x.textAlign = 'center'; x.font = '22px "Times New Roman", serif';
  x.fillText(`${cfg.title} (${c.name})`, 397, 151);
  x.font = '13px Arial'; x.fillStyle = '#555';
  x.direction = 'rtl'; x.fillText(`${c.stage} - ${c.track}${c.grade ? ' - ' + c.grade : ''}`, 397, 169); x.direction = 'ltr'; x.fillStyle = '#000';
  // table
  const X0 = 55, cw = [75, 135, 232, 150, 87], top = 177, hh = 70, bottom = 975, rh = (bottom - top - hh) / rows.length;
  const xs = [X0]; cw.forEach((w) => xs.push(xs[xs.length - 1] + w));
  x.fillStyle = '#c9c9c9'; x.fillRect(X0, top, xs[5] - X0, hh); x.fillRect(X0, top + hh, cw[0], bottom - top - hh);
  x.strokeStyle = '#000'; x.lineWidth = 1.5;
  for (let i = 1; i < 5; i++) { x.beginPath(); x.moveTo(xs[i], top); x.lineTo(xs[i], bottom); x.stroke(); }
  for (let r = 1; r < rows.length; r++) { const yy = top + hh + r * rh; x.beginPath(); x.moveTo(X0, yy); x.lineTo(xs[5], yy); x.stroke(); }
  x.lineWidth = 4; x.beginPath(); x.moveTo(X0, top + hh); x.lineTo(xs[5], top + hh); x.stroke();
  x.lineWidth = 3.5; x.strokeRect(X0, top, xs[5] - X0, bottom - top);
  x.fillStyle = '#000'; x.textBaseline = 'middle'; x.textAlign = 'center';
  ['Session', 'Subject', 'What was Achieved', 'Task', 'Signature'].forEach((t, i) => {
    x.font = (i === 0 || i === 4 ? 'bold 15px' : 'bold 19px') + ' "Times New Roman", serif'; x.fillText(t, xs[i] + cw[i] / 2, top + hh / 2);
  });
  rows.forEach((r, i) => {
    const y = top + hh + i * rh;
    x.font = 'bold 18px "Times New Roman", serif'; x.fillStyle = '#000'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(String(r.n), xs[0] + cw[0] / 2, y + rh / 2);
    cellText(x, r.subject, xs[1], y, cw[1], rh, 17);
    cellText(x, r.achieved, xs[2], y, cw[2], rh, 16);

  return cv;
}
const toBytes = async (cv, type, q) => new Uint8Array(await (await new Promise((r) => cv.toBlob(r, type, q))).arrayBuffer());

function makePDF(jpegs, W, H) {
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = (b) => { if (typeof b === 'string') b = enc.encode(b); parts.push(b); len += b.length; };
  const obj = (id, fn) => { offs[id] = len; push(`${id} 0 obj\n`); fn(); push('\nendobj\n'); };
  const n = jpegs.length;
  push('%PDF-1.4\n');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Kids [${jpegs.map((_, i) => `${3 + 3 * i} 0 R`).join(' ')}] /Count ${n} >>`));
  jpegs.forEach((j, i) => {
    const p = 3 + 3 * i, cs = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(p, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${p + 2} 0 R >> >> /Contents ${p + 1} 0 R >>`));
    obj(p + 1, () => push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(p + 2, () => { push(`<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.length} >>\nstream\n`); push(j); push('\nendstream'); });
  });
  const total = 3 * n + 3, xref = len;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for (let i = 1; i < total; i++) push(String(offs[i]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

const touch = () => matchMedia('(pointer:coarse)').matches;

  return `<div class="card"><h2>إضافة مشرف أو متحكم</h2><p class="muted">المدرسين مش محتاجين حساب، بيدخلوا باسمهم بس.</p><div class="row">
  <div><label class="l" for="nn">الاسم </label><input type="text" id="nn"></div>
  <div><label class="l" for="nu">اسم الدخول</label><input type="text" id="nu" dir="ltr" autocapitalize="none"></div>
  <div><label class="l" for="np">كلمة المرور</label><input type="text" id="np" dir="ltr"></div>
  <div><label class="l" for="nr">الصلاحية</label><select id="nr"><option value="supervisor">مشرف</option><option value="controller">متحكم</option></select></div></div>
  <p><button class="btn" data-act="user-add">إضافة</button></p></div>
  <div class="card"><h2>المستخدمين (${S.users.length})</h2><table class="tbl">${S.users.map((u) => `<tr><td><b>${esc(u.name)}</b><br><span class="muted" dir="ltr">${esc(u.username)}</span></td><td>${ROLE_AR[u.role]}</td>
  <td style="text-align:left"><button class="btn sec sm" data-act="user-pass" data-v="${u.id}">تغيير كلمة المرور</button> ${u.id !== S.user.id ? `<button class="btn red sm" data-act="user-del" data-v="${u.id}">حذف</button>` : ''}</td></tr>`).join('')}</table></div>`;
}

/* ================= settings tab ================= */
function settingsHTML() {
  const c = S.cfgDraft, tr = ['عربي', 'لغات'];
  const sel = (path, val, opts) => `<select data-act="cfg" data-p="${path}">${opts.map((o) => `<option value="${esc(o.v)}" ${o.v === val ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
  const inp = (path, val, ph) => `<input type="text" data-act="cfg" data-p="${path}" value="${esc(val)}" placeholder="${ph || ''}">`;
  return `<div class="card"><h2>بيانات النموذج</h2>
  <label class="l">السطر الأول</label>${inp('headerLine1', c.headerLine1)}<label class="l">السطر التاني</label>${inp('headerLine2', c.headerLine2)}
  <div class="row"><div><label class="l">عنوان النموذج</label>${inp('title', c.title)}</div><div><label class="l">عدد الحصص في اليوم</label><input type="number" min="1" max="12" data-act="cfg" data-p="sessions" value="${c.sessions}"></div></div></div>
  <div class="card"><h2>المراحل</h2><p class="muted">كل مرحلة في سطر</p><textarea data-act="cfg-stages">${esc(c.stages.join('\n'))}</textarea></div>
  <div class="card"><h2>إضافة فصول بسرعة</h2><p class="muted">اختاري المرحلة والقسم واكتبي اسم الصف وأسماء الفصول بينها فاصلة. مثال: الصف «Primary 1» والفصول «1A,1B,1C,1D».</p>
  <div class="row"><div><label class="l" for="qa_stage">المرحلة</label><select id="qa_stage">${c.stages.map((s) => `<option>${esc(s)}</option>`).join('')}</select></div>
  <div><label class="l" for="qa_track">القسم</label><select id="qa_track">${tr.map((s) => `<option>${s}</option>`).join('')}</select></div>
  <div><label class="l" for="qa_grade">الصف</label><input type="text" id="qa_grade" placeholder="مثلا أولى أو Primary 2"></div></div>
  <label class="l" for="qa_names">أسماء الفصول</label><input type="text" id="qa_names" placeholder="1/1, 1/2, 1/3">
  <p><button class="btn sec sm" data-act="quick-add">إضافة</button></p></div>
  <div class="card"><h2>الفصول (${c.classes.length})</h2><div style="overflow-x:auto"><table class="tbl">${c.classes.map((x, i) => `<tr><td>${sel(`classes.${i}.stage`, x.stage, c.stages.map((s) => ({ v: s, l: s })))}</td><td>${sel(`classes.${i}.track`, x.track, tr.map((s) => ({ v: s, l: s })))}</td><td>${inp(`classes.${i}.grade`, x.grade || '', 'الصف')}</td><td>${inp(`classes.${i}.name`, x.name, 'اسم الفصل')}</td><td><button class="btn red sm" data-act="cfg-del" data-v="classes.${i}">حذف</button></td></tr>`).join('')}</table></div>
  <p><button class="btn sec sm" data-act="cfg-add" data-v="classes">+ إضافة فصل</button></p></div>
  <div class="card"><h2>المواد</h2><p class="muted">الرمز هو اللي بيظهر في خانة Subject في النموذج (مثلا E أو M أو عربي)</p><table class="tbl">${c.subjects.map((x, i) => `<tr><td>${inp(`subjects.${i}.name`, x.name, 'اسم المادة')}</td><td>${inp(`subjects.${i}.code`, x.code, 'الرمز')}</td><td>${sel(`subjects.${i}.track`, x.track, [{ v: 'both', l: 'عربي ولغات' }, { v: 'عربي', l: 'عربي فقط' }, { v: 'لغات', l: 'لغات فقط' }])}</td><td><button class="btn red sm" data-act="cfg-del" data-v="subjects.${i}">حذف</button></td></tr>`).join('')}</table>
  <p><button class="btn sec sm" data-act="cfg-add" data-v="subjects">+ إضافة مادة</button></p></div>
  <p><button class="btn" data-act="cfg-save">حفظ الإعدادات</button></p>`;
}
function setPath(obj, path, val) { const k = path.split('.'); let o = obj; while (k.length > 1) o = o[k.shift()]; o[k[0]] = val; }

/* ================= events ================= */
document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, v = t.dataset.v;
  if (act === 'login') return doLogin();
  if (act === 'login-teacher') return doTeacherLogin();
  if (act === 'mode') { S.mode = v || null; return renderLogin(); }
  if (act === 'pickname') { $('#tn').value = v; return doTeacherLogin(); }
  if (act === 'retry') return boot();
  if (act === 'logout') return logout();
  if (act === 'tab') { S.tab = v; if (v === 'settings') S.cfgDraft = null; return renderApp(); }
  if (act === 'chip') {
    const k = t.dataset.k; S.sel[k] = v;
    if (k === 'stage') { S.sel.track = ''; S.sel.grade = ''; S.sel.classId = ''; S.sel.subjectId = ''; }
    if (k === 'track') { S.sel.grade = ''; S.sel.classId = ''; S.sel.subjectId = ''; }
    if (k === 'grade') { S.sel.classId = ''; S.sel.subjectId = ''; }
    saveSel(); return renderView();
  }
  if (act === 'save') return saveEntry();
  if (act === 'edit') {
    const e = S.entries.find((x) => x.id === v); if (!e) return;
    Object.assign(S.sel, { subjectId: e.subjectId, from: e.session, to: e.session }); S.draft = { achieved: e.achieved, task: e.task };
    renderView(); return window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  if (act === 'del') {
    if (!confirm('تحذف التسجيل ده؟')) return;
    try { await api('/api/entries/' + v, 'DELETE'); await refreshEntries(true); toast('تم الحذف'); } catch (e) { toast(e.message, true); } return;
  }
  if (act === 'sync-export') {
    const f = new File([JSON.stringify(LOCAL.exportData())], `followup-${S.today}-${safe(S.user.name)}.json`, { type: 'application/json' });
    if (touch() && canShareFiles([f])) { try { await navigator.share({ files: [f] }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    download(f, f.name); return toast('تم تحميل الملف ✓');
  }
  if (act === 'build-file') { download(buildUpdatedFile(), 'school-followup.html'); return toast('تم تحميل النسخة ✓'); }
  if (act === 'export-pdf') return exportAll('pdf');
  if (act === 'export-img') return exportAll('img');
  if (act === 'gal-close') return closeGallery();
  if (act === 'gal-all') return downloadAll(S.gal.files);
  if (act === 'gal-share') { try { await navigator.share({ files: S.gal.files }); } catch (e) { if (e.name !== 'AbortError') toast('المشاركة مش متاحة هنا، احفظي كل صورة لوحدها', true); } return; }
  if (act === 'png') return exportOne(v);
  if (act === 'user-add') {
    try { S.users = (await api('/api/users', 'POST', { name: $('#nn').value, username: $('#nu').value, password: $('#np').value, role: $('#nr').value })).users; toast('تمت الإضافة ✓'); renderView(); } catch (e) { toast(e.message, true); } return;
  }
  if (act === 'user-del') {
    if (!confirm('تحذف المستخدم ده؟ (تسجيلاته القديمة هتفضل موجودة)')) return;
    try { S.users = (await api('/api/users/' + v, 'DELETE')).users; renderView(); } catch (e) { toast(e.message, true); } return;
  }
  if (act === 'user-pass') {
    const p = prompt('كلمة المرور الجديدة:'); if (!p) return;
    try { await api('/api/users/' + v, 'PUT', { password: p }); toast('تم تغيير كلمة المرور ✓'); } catch (e) { toast(e.message, true); } return;
  }
  if (act === 'quick-add') {
    const names = $('#qa_names').value.split(/[,،\n]+/).map((s) => s.trim()).filter(Boolean);
    if (!names.length) return toast('اكتبي أسماء الفصول', true);
    names.forEach((n) => S.cfgDraft.classes.push({ id: '', stage: $('#qa_stage').value, track: $('#qa_track').value, grade: $('#qa_grade').value.trim(), name: n }));
    toast(`اتضاف ${names.length} فصل، متنسيش تدوسي «حفظ الإعدادات»`); return renderView();
  }
  if (act === 'cfg-add') {
    const d = S.cfgDraft;
    if (v === 'classes') d.classes.push({ id: '', stage: d.stages[0] || '', track: 'لغات', grade: '', name: '' });
    else d.subjects.push({ id: '', name: '', code: '', track: 'both' });
    return renderView();
  }
  if (act === 'cfg-del') { const [k, i] = v.split('.'); S.cfgDraft[k].splice(+i, 1); return renderView(); }
  if (act === 'cfg-save') {
    try {
      const j = await api('/api/config', 'PUT', { config: S.cfgDraft }); S.config = j.config; S.cfgDraft = JSON.parse(JSON.stringify(S.config));
      toast('تم حفظ الإعدادات ✓'); renderView();
    } catch (e) { toast(e.message, true); } return;
  }
});
document.addEventListener('input', (ev) => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act === 'draft') S.draft[t.dataset.k] = t.value;
  if (t.dataset.act === 'cfg') setPath(S.cfgDraft, t.dataset.p, t.type === 'number' ? +t.value : t.value);
  if (t.dataset.act === 'cfg-stages') S.cfgDraft.stages = t.value.split('\n').map((s) => s.trim()).filter(Boolean);
});
document.addEventListener('change', async (ev) => {
  const t = ev.target;
  if (t.id === 'imp0') {
    try { let n = 0; for (const f of t.files) { LOCAL.importData(JSON.parse(await f.text())); n++; } toast(`تم استيراد ${n} ملف ✓ دلوقتي ادخلي بحسابك`); renderLogin(); } catch (e) { toast(e.message, true); }
    return;
  }
  if (t.id === 'imp') {
    let tot = { added: 0, updated: 0, conflicts: 0, removed: 0, cfg: false };
    try {
      for (const f of t.files) { const r = LOCAL.importData(JSON.parse(await f.text())); ['added', 'updated', 'conflicts', 'removed'].forEach((k) => (tot[k] += r[k])); tot.cfg = tot.cfg || r.cfg; }
      toast(`تم الدمج ✓ جديد: ${tot.added} | محدّث: ${tot.updated}${tot.conflicts ? ' | تعارض اتحل بالأحدث: ' + tot.conflicts : ''}${tot.cfg ? ' | اتحدثت الإعدادات' : ''}`);
      await boot();
    } catch (e) { toast(e.message, true); }
    return;
  }
  if (t.id === 'dateSel') { if (t.value) { S.date = t.value; await refreshEntries(true); renderView(); } return; }
  const a = t.dataset && t.dataset.act; if (!a) return;
  if (a === 'sess') { S.sel[t.dataset.k] = +t.value; if (t.dataset.k === 'from' && S.sel.to < S.sel.from) S.sel.to = S.sel.from; saveSel(); renderView(); }
  if (a === 'as') { S.sel.asName = t.value; saveSel(); }
  if (a === 'flt') { S.flt[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.value; paintLive(); }
  if (a === 'cfg') { if (t.dataset.p.includes('.stage') || t.dataset.p === 'sessions') renderView(); }
  if (a === 'cfg-stages') renderView();
});

setInterval(() => { if (S.user && document.visibilityState === 'visible' && (S.tab === 'record' || S.tab === 'forms')) refreshEntries(); }, 5000);
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('storage', () => refreshEntries());
boot();
})();

</script>
</body>
</html>
